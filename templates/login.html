{% extends "base.html" %}{% block title %}Masuk{% endblock %}
{% block auth %}<div class="card"><h1>Masuk</h1>
<form method="post" action="/login">
  <label>Username<input name="username" required autofocus autocomplete="username"></label>
  <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
  <button class="btn" style="justify-content:center">Masuk</button>
</form>
<p style="margin:16px 0 0">Belum punya akun? <a href="/register">Daftar sebagai nasabah</a></p></div>{% endblock %}
