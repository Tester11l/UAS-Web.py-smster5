{% extends "base.html" %}{% block title %}Daftar{% endblock %}
{% block auth %}<div class="card"><h1>Daftar nasabah</h1>
<form method="post" action="/register">
  <label>NIK<input name="nik" required inputmode="numeric" autofocus></label>
  <label>Nama lengkap<input name="nama" required></label>
  <label>Alamat<input name="alamat"></label>
  <label>No. HP<input name="no_hp" inputmode="tel"></label>
  <label>Username<input name="username" required autocomplete="username"></label>
  <label>Password (min. 6 karakter)<input name="password" type="password" minlength="6" required autocomplete="new-password"></label>
  <button class="btn" style="justify-content:center">Buat akun</button>
</form>
<p style="margin:16px 0 0">Sudah punya akun? <a href="/login">Masuk</a></p></div>{% endblock %}
